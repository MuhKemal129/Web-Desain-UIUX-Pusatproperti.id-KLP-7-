<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pusatproperti.id</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-card">
        <div class="header-login">
            <a href="index.html" class="back-btn" title="Kembali">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <h1 class="title">Masuk Ke Akun</h1>
        </div>

        <div class="logo-container">
            <img src="logo.png" alt="Pusatproperti.id">
        </div>

        <div class="tab-menu">
            <a href="Login_member.html" class="tab-item active">Member Umum</a>
            <a href="Login_agen.html" class="tab-item inactive">Agen Pusatproperti.id</a>
        </div>

        <form onsubmit="event.preventDefault(); window.location.href='HomePage.html';">
            <div class="input-group">
                <label>Email/Username</label>
                <div class="inner-input">
                    <i class="fa-regular fa-user icon-field"></i>
                    <input type="text" name="user" placeholder="Masukkan email/username" required>
                </div>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="inner-input">
                    <i class="fas fa-lock icon-field"></i>
                    <input type="password" name="pass" placeholder="Masukkan password" required>
                    <i class="fa-regular fa-eye eye-icon"></i>
                </div>
            </div>

            <div class="extra-row">
                <div class="remember-me">
                    <input type="checkbox" id="keep-login">
                    <label for="keep-login">Tetap masuk</label>
                </div>
                <a href="#" class="forgot-link">Lupa Kata Sandi?</a>
            </div>

            <button type="submit" class="btn-login">Masuk</button>
        </form>

        <div class="social-section">
            <div class="divider">
                <span>Atau daftar dengan</span>
            </div>

            <div class="social-icons-row">
                <button type="button" class="btn-social-icon">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                </button>
                <button type="button" class="btn-social-icon">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple">
                </button>
            </div>

            <p class="footer-register">
                Belum punya akun? <a href="Register_agen.html">Daftar di sini</a>
            </p>
        </div>
    </div>

</body>
</html>
